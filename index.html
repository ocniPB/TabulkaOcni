<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Služby oční</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      width: 80%;
      max-width: 400px;
    }

    h1 {
      margin-bottom: 15px;
    }

    .description {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .button {
      display: block;
      padding: 18px;
      background: #0078d4;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
    }

    .button2 {
      display: block;
      padding: 18px;
      background: #0078d4;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
    }

    .notice {
      margin-top: 30px;
      padding: 15px;
      background: #fff3cd;
      border-radius: 10px;
      font-size: 16px;
    }

    .notice-title {
      font-weight: bold;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>👁️ Služby oční</h1>

    <div class="description">
      Otevřete aktuální tabulku služeb.
    </div>

    <a class="button"
       href="https://1drv.ms/…R">
       OTEVŘÍT TABULKU
    </a>

    <a class="button2"
       href="https://1drv.ms/…R">
       Vitreo
    </a>

    
    <!-- 
    ZDE MŮŽETE NAPSAT POZNÁMKU 
    <div class="notice">
      <div class="notice-title">⚠️ UPOZORNĚNÍ</div>
      <p></p>
    </div>
    -->

  </div>

</body>
</html>
