<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabulka služby oční</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      width: 80%;
      max-width: 400px;
    }

    h1 {
      margin-bottom: 15px;
    }

    .description {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .button {
      display: block;
      padding: 30px;
      background: #1D6F42;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      margin-bottom: 70px;
      cursor: pointer;
    }

    .description2 {
      margin-top: 30px;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .description3 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .buttonDOVOLENKY {
      margin-bottom: 20px;
      display: block;
      padding: 18px;
      background: #ffe599;
      color: black;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      border-radius: 40px;
    }

    .buttonOBEDY {
      margin-bottom: 20px;
      display: block;
      padding: 18px;
      background: #ffe599;
      color: black;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      border-radius: 40px;
    }

    .button2 {
      margin-bottom: 20px;
      display: block;
      padding: 18px;
      background: #ffe599;
      color: black;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      border-radius: 40px;
    }

    .button3 {
      display: block;
      padding: 18px;
      background: #ffe599;
      color: black;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      border-radius: 40px;
    }

    /* Okno s heslem */

    #passwordBox {
      display: none;
      margin-top: 25px;
      padding: 25px;
      background: #f8f8f8;
      border-radius: 12px;
    }

    #passwordBox h2 {
      margin-top: 0;
      font-size: 20px;
    }

    #password {
      width: 90%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 12px;
    }

    .passwordButton {
      width: 90%;
      padding: 14px;
      background: #1D6F42;
      color: white;
      border: none;
      font-size: 17px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    #error {
      color: #c00000;
      font-weight: bold;
      margin-top: 12px;
      display: none;
    }

  </style>
</head>

<body>

  <div class="box">

    <h1>👁 Tabulka služby oční 👁</h1>

    <div class="description">
      Kliknutím vyberte.
    </div>

    <!-- TLAČÍTKO TABULKY -->

    <a class="button" onclick="showPassword()">
      OTEVŘÍT TABULKU
    </a>

    <!-- HESLO -->

    <div id="passwordBox">

      <h2>🔒 Přístup k tabulce</h2>

      <input
        type="password"
        id="password"
        placeholder="Zadejte přístupový kód"
        onkeydown="if(event.key === 'Enter') checkPassword()"
      >

      <button class="passwordButton" onclick="checkPassword()">
        POKRAČOVAT
      </button>

      <div id="error">
        Nesprávný přístupový kód.
      </div>

    </div>


    <div class="description2">
      ________________________________________
    </div>

    <div class="description3">
      Odkazy:
    </div>

    <a class="buttonDOVOLENKY"
       href="https://onp.hrportal.cz/">
       Dovolenky
    </a>

    <a class="buttonOBEDY"
       href="https://obj.onp.cz/">
       Obědy
    </a>

    <a class="button2"
       href="https://cvrs.cz/#pohotovost-kalendar">
       Vitreoretinální pohotovost
    </a>

    <a class="button3"
       href="https://www.vfn.cz/pacienti/kliniky-ustavy/ocni-klinika/klinicke-seminare/">
       Klinické semináře VFN
    </a>


    <!--
    ZDE MŮŽETE NAPSAT POZNÁMKU

    <div class="notice">
      <div class="notice-title">⚠️ UPOZORNĚNÍ</div>
      <p></p>
    </div>
    -->

  </div>


  <script>

    // ADRESA EXCELU
    const excelUrl = "https://1drv.ms/x/c/9124d54ad59bd03c/IQA4VB66i3HaTJrcFRRqBe3RAek_HMw5tnLF_YXaWXsLtuU?e=la8R1A";

    // HESLO
    const correctPassword = "oct";


    // ZOBRAZÍ OKNO S HESLEM

    function showPassword() {

      document.getElementById("passwordBox").style.display = "block";

      document.getElementById("password").focus();

    }


    // KONTROLA HESLA

    function checkPassword() {

      const password = document.getElementById("password").value;

      if (password === correctPassword) {

        window.location.href = excelUrl;

      } else {

        document.getElementById("error").style.display = "block";

        document.getElementById("password").value = "";

        document.getElementById("password").focus();

      }

    }

  </script>

</body>
</html>
